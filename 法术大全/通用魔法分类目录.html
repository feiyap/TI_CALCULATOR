<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>无限恐怖 · 通用魔法分类目录</title>
  <style>
    :root {
      --bg: #1b1b1d;
      --panel: #242426;
      --line: #3a3a3d;
      --text: #e8e8ea;
      --muted: #9a9aa0;
      --accent: #4f8cff;
      --chip: #2c2c2f;
      --chip-on: #3d5a99;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 24px; font-weight: 650; margin: 0 0 6px; }
    h2 { font-size: 16px; margin: 22px 0 10px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 18px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    input[type="search"] {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 8px 10px;
      margin: 0 0 10px;
    }
    .label { color: var(--muted); font-size: 12px; margin: 8px 0 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--text);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .chip.on { background: var(--chip-on); border-color: var(--accent); }
    .toolbar { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; }
    .toolbar button {
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--text);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .count { color: var(--muted); font-size: 12px; }
    .spell {
      border: 1px solid var(--line);
      background: var(--panel);
      margin: 0 0 6px;
    }
    .spell summary {
      cursor: pointer;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: baseline;
      list-style: none;
    }
    .spell summary::-webkit-details-marker { display: none; }
    .spell summary::marker { content: ""; }
    .spell summary:before {
      content: "▸";
      color: var(--muted);
      width: 1em;
      flex: none;
    }
    .spell[open] summary:before { content: "▾"; color: var(--accent); }
    .name { font-weight: 600; flex: 1 1 180px; }
    .meta { color: var(--muted); font-size: 12px; }
    .body {
      padding: 12px 12px 16px 36px;
      border-top: 1px solid var(--line);
      white-space: pre-wrap;
      color: #d2d2d6;
      font-size: 13px;
      line-height: 1.7;
    }
    .empty { color: var(--muted); padding: 16px 4px; }
    .foot { color: var(--muted); font-size: 12px; margin-top: 18px; }
  </style>
</head>

能同时生效，施法时决定。 \n哈达之攫：花费25XP，若角色的魔能爆成功对目标造成伤害，目标需要进行力量判定，并在判定结果中加上自身体积调整，若结果低于所受伤害，每低1点将被向施法者方向拉近1米，如果遇到障碍无法前进，则剩余的每米对目标造成1点物理冲击伤害。本效果与斥力魔爆不能同时生效，施法时决定。 \n怠惰之枪：花费25XP，角色的魔能爆命中后使目标的基础移动速度降低威力值米，可叠加，持续一个场景。 \n莫菲斯托费利斯之吻：花费与当前法术自学价格XP的一半，并在每次升阶时需要随之更新支付，角色在施展魔能爆时可将动作提升至整轮，如此一来，魔能爆将在命中目标后爆炸而非正常造成伤害，对以目标为中心，半径智力*法术威力*5米球形区域内所有目标造成等同魔能爆武器伤害的范围伤害，并具有相同的特性，反射豁免。"},{"name":"X龙的咆哮","schools":["塑能","变化"],"grade":"C","power":"6","price":"C+1000","kind":"能力组","source":"灭龙魔导士","bucket":"视为通用","body":"X龙的咆哮 \n专业：塑能/变化 \n威力：6 \n价格：C+1000 \n动作：整轮 \n能耗：3点魔力 \n成分：语言，姿势 \n射程：无 \n范围：耐力*法术威力*5米 \n持续：整轮动作维持 \n该法术如同龙息般生效，你深吸一口气将其吐出，选择一个方向，你进行一次施法判定，该方向上长度等同法术范围的锥体区域内所有目标受到本法术威力*2.5的某种严重伤害，反射豁免，你施法判定的成功数作为目标豁免中的减值。并且每因此受到1点伤害，会被击退1米，若后退被阻挡则会受到1点物理冲击伤害，因此至少被击退1米的生物将处于倒地状态。 \n火/雷/影/光对应的伤害类型为火焰，电击，腐蚀，纯能。 \n天龙对应的伤害类型是力场，铁龙对应的是物理，毒龙对应的是毒素，并且毒龙需要强韧豁免而非反射豁免。 \n本法术可以以整轮动作专注维持，每轮可以重设方向。 \n特殊：本法术的名字跟随龙类变化。 \n特殊：若你因A级灭龙魔导士特性处于混合龙效果之下，本法术可以同时使用等同混合龙数次，所有效果各自独立计算。注意，即使你购买了不同种类的灭龙魔导士也不意味着你会处于混合龙的效果之下，依然必须经有A级特性吞食原本无法吞食的对象才行。 \n特殊：对前5类龙法术专业为塑能，后两类为变化 \n\nB级通用"},{"name":"冰墙","schools":["塑能"],"grade":"C","power":"6","price":"C+1000","kind":"能力组","source":"元素师","bucket":"视为通用","body":"冰墙 \n专业：塑能 \n威力：6 \n价格：C+1000 \n动作：标准 \n能耗：3点 \n成分：语言，姿势 \n射程：自身 \n范围：5米*智力*威力值 \n持续时间：一个场景 \n效果：在自身周围竖起环形冰墙，推开敌人，造成伤害，并阻挡后续攻击。 \n以你为中心，至多等同法术范围的半径圆环区域上升起高度等同智力*威力米的冰墙，该区域上的所有目标受到法术威力点寒冷伤害和同等数量的冻结点数，强韧同时豁免两者，在与冰墙相邻方格内结束回合的生物会受到同一影响。 \n此外，在法术环形区域上目标需要进行力量判定，将自身体积调整作为附加成功计入，难度等同法术威力，若判定失败会被推至冰墙外侧，无法移动的固定物体会直接损毁，若判定成功，这些目标占据的位置不产生冰墙。 \n冰墙阻断视线和效果线，受到攻击时，将其视为等同法术等级的物品（因此通常视为C+1000的物品），其在受到火焰伤害时硬度失效并且受到双倍伤害。 \n当物品被击破时，法术效果结束，所有冰墙都会一并崩溃。 \n特殊的，施法者可以自由穿越冰墙，也不会受到伤害和冻结点数。"},{"name":"冰墙术","schools":["塑能"],"grade":"C","power":"6","price":"C+1000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"冰墙术 \n专业：塑能 \n威力：6 \n价格：C+1000 \n动作：标准动作 \n能耗：3 \n成分：姿势，语言 \n射程：特殊 \n范围：特殊 \n持续：一个场景，或以标准动作解消。 \n效果：你创造出一段冰墙用于防御或阻止他人 \n本法术有数种用法如下： \n1.以此法术创造线性冰墙，以此法术创造出的冰墙起点必须与你相邻且位于固体表面，并且冰墙路径不能直接经过任何目标所在方格，线性冰墙长度至多为法术威力值*智力值*10米，高度为法术威力值米，厚度为1米，以此方式创造冰墙时，每米冰墙具有 \n\n弧形打击Radial Strike\n价格：D+500 \n以一个标准动作，消耗1点魔力，你向扫把中充填魔力，将扫把作为炮筒，射出魔力爆弹。 \n这视同你用无支线枪炮中的迫击炮发起了一次攻击，但造成的是纯能量严重伤害，当然无需弹药，也无需双人编组特性的调整，同样无需力量作为前提，此外，这次伤害中具有魔法，正常攻击灵体特性。 \n进化：光符“闪光冲击”（15XP） \n若将魔力消耗提高到3点，动作提高到整轮动作，本能力产生的炮击威力获得大幅度加强，武器伤害提升4点，并获得能量武器特性。 \n再次进化：星符“重力一击”（40XP） \n若在光符“闪光冲击”的基础上将魔力消耗提升至5点，那么炮击威力进一步加强，武器伤害再提升6点，射程提升一倍，并且你可以在攻击中自由的画出抛物线路径，仅在抛物线路径上获得超级贯穿特性。 \n\n物品 \n魔法废物再利用炸弹 \n\nD+500 \n本兑换本质上是一项技艺而非物品，该技艺允许你在制造蘑菇炼金所能制造的物品时收集其产生的废料做成炸弹，炸弹的强度取决于你制造的物品等级。 \n当你制造无支线物品时，获得的废物炸弹相当于破片手雷，但有以下不同： \n1.其造成的伤害是纯能量伤害，伤害仅有5L \n2.投掷技巧中，投掷者进行的是施法判定而不是投掷判定。 \n3.是魔幻本质而不是科技本质 \n当你制造D级物品时，产生的废物炸弹伤害增加4点，爆炸半径加倍，制造C级物品时，废物炸弹伤害再增加8点，爆炸半径再增加两倍，基础投掷距离而增加两倍。 \n\n地球光 \n\nD+500 \n本质：魔幻本质 \n分类：爆炸物，消耗品 \n体积：1 \n描述：魔理沙创造的炼金炸弹，能产生直线光束。 \n武器基本属性：武器伤害0B，基础射程单位10米 \n武器特殊属性：【轻投掷武器】 \n爆炸：本武器会以落点为中心，由你选择一个方向，产生一道有高度穿透力的光束，对高度宽度皆为1米，长度100米直线区域内造成14点纯能量严重伤害和同等数量可叠加目眩点数，反射同时豁免两者，伤害中具有16点破甲值，无视至多4点能量抗力或伤害吸收，并具有超级贯穿特性。 \n\n生态学炸弹 \n\nC+1000 \n本质：魔幻本质 \n分类：爆炸物，消耗品 \n体积：1 \n描述：魔理沙创造的炼金炸弹，尚不稳定，具有极其可怕的破坏力。 \n武器基本属性：武器伤害0B，基础射程单位50米 \n武器特殊属性：【轻投掷武器】 \n爆炸：本武器会以落点为中心，产生半径 \n100米球形区域内26点纯能量严重伤害，强韧豁免。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"元素毁灭","schools":["塑能"],"grade":"S","power":"48","price":"S+8000","kind":"血统","source":"雅娜斯特（魔语者）","bucket":"视为通用","body":"元素毁灭 \n专业：塑能 \n威力：48 \n价格：S+8000 \n动作：标准动作 \n能耗：9 \n成分：姿势，语言 \n射程：10米*智力值*威力值 \n范围：5米*智力值*威力值 \n持续：立即 \n效果：将法术范围内的所有元素力量解放，相当于原子裂变一般，只是释放的能量更加可怕。 \n选择射程内一点，以该点为中心，法术范围为半径的球形区域中被元素裂变产生的混沌能量吞噬，你进行一次施法判定，区域内所有目标受到法术威力值*2的纯能量恶性伤害，反射豁免，但在豁免中受到等同你判定成功数的减值。 \n该伤害无视硬度，能量抗力，伤害吸收，降级，也不能被能量免疫，每3点临时生命才能吸收1点这种伤害。"},{"name":"星光破坏炮","schools":["塑能"],"grade":"S","power":"48","price":"S+8000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"星光破坏炮 \n关键字：【光】 \n专业：塑能 \n威力：48 \n价格：S+8000 \n动作：1轮 \n能耗：9 \n成份：语言，动作，法器 \n射程：自身 \n范围：选择一个方向，以你为底面中心，长度10米*智力值*法术威力值，底面半径5米*智力*法术威力的圆柱体区域 \n持续：立即 \n描述：这道法术的发明人是时空管理局三巨头之一的高町奈叶，以不可思议的方式利用被使用过之后回归于存在本源性质的魔力，并将它用于强化本来就已经很强大的破坏力。发射时，曾被使用者使用而回归于虚空的魔法能量会在空中重新汇集起来，并化作光束回归于法器的发射口中，远看就如万道星光汇聚，美丽无比。 \n你在你的回合中诵咒并汇集魔力，下回合你的行动开始时选择一个方向轰出这道法术。巨大的魔力冲击束充斥整个法术范围，伤害范围中的所有目标 \n法术造成范围伤害等同法术威力值*1.5，类型是纯能量严重伤害，但是这个场景中每3点消耗过的通用能量会提升1点范围伤害，范围内的所有目标进行强韧豁免，你进行一次施法判定，成功数作为这些目标在强韧豁免中失去的成功数。法术造成的伤害能正常攻击灵体和虚体。 \n本法术能击破等同你智力上传奇点数+神秘技能上附加成功+威力值1/3的伤害减免，吸收，抵消，转化，能量抗力和硬度（每种都会被击破这么多）。 \n本法术可以设定为非杀伤模式，此模式下不会破坏物品，并且被打中的生物不会受到伤害，而是受到等同伤害的晕眩点数（至多法术威力*2），如同伤害一般进行强韧豁免，可以叠加。 \n在法术完成后，你可以以整轮动作消耗9点魔力维持法术，每轮产生一次法术效果，或者，你也可以放弃维持，结束这个法术。 \n本法术在结束时，所有受到法术伤害的对象会发生巨大的爆炸，以每一个受到法术伤害的对象为中心，半径5米*你的智力*威力值，再造成一次法术效果，受到法术伤害的对象也会受到这个二次伤害。这个结束效果不会在一个法术中重复触发。 \n进化（130XP）：你可以将本法术变为接触法术，同时法术的施法动作变为标准动作，这样法术的范围会从被接触的目标开始，你进行一次接触攻击，若攻击命中，所有结界专业的法术，其他意义上的结界或其他提供硬度，临时生命值的效果都无法保护目标，例如四天圣精奉还或护盾等。即使攻击没有命中，你也可以选择启动法术的效果，或者等待下一次接触攻击。"},{"name":"绝对零度空间","schools":["塑能"],"grade":"S","power":"48","price":"S+8000","kind":"血统","source":"雅娜斯特（魔语者）","bucket":"视为通用","body":"绝对零度空间 \n专业：塑能 \n威力：48 \n价格：S+8000 \n动作：标准动作 \n能耗：9 \n成分：姿势，语言 \n射程：10米*智力值*威力值 \n范围：5米*智力值*威力值 \n持续：立即 \n效果：在法术范围内的温度瞬间下降到绝对零度，一切物体都将被冰冻，这是连时间和空间都仿佛能凝固的法术。 \n选择射程内一点，以该点为中心，法术范围为半径的球形区域中化为绝对零度的冰封区域，你进行一次施法判定，区域内所有目标受到法术威力值*2的寒冷能量恶性伤害，强韧豁免，但在豁免中受到等同你判定成功数的减值。 \n无论区域内的生物是否受到伤害，整个区域都会被冰封，其中的生物视同处于定身状态，但无论区域外部对内部，内部对外部，还是内部对内部，都只有视线，没有效果线。 \n要攻击区域内的目标，等同于要先击破本法术效果，将其整体视为一个S+8000的物体来处理。 \n每轮该物体生命值都会下降1点。 \n被冰封在其中没有死亡的生物每轮会再次受到寒冷伤害效果，但变为严重伤害而非恶性伤害。 \n他们每轮能以整轮动作进行力量判定，将体积调整作为附加成功数，判定结果作为对法术本体造成的伤害（依然需要通过硬度减伤），多个生物造成的伤害可以叠加计算。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"重破斩","schools":["塑能","召唤"],"grade":"S","power":"48","price":"S+8000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"重破斩 \n专业：塑能，召唤 \n威力：48 \n价格：S+8000 \n动作：标准 \n能耗：见下 \n成分：语言，姿势 \n射程：10米*智力值*法术威力 \n范围：半径5米*智力值*法术威力 \n持续：立即 \n效果：魔剑美神中的著名法术，借用金色魔王罗德布奈特梅亚的力量使用的咒文，令金色魔王的权能降临至法术区域，在瞬间摧毁区域内一切规则与事物转化为混沌之海的术法。 \n此法术的控制极为困难，你进行一次施法检定，若检定结果低于本法术威力*2，法术失控，金色魔王将窃取你的身体控制权，在非slayers世界中金色魔王只会存在一个瞬间，之后便被世界排斥，你也会不可避免的因此死亡，视为先排斥出任务世界，后被主神抹杀，在slayers世界则可能导致一场灭世级的灾难（ST可以主导这一局面，也可以简单的使用该世界被摧毁，所有团队任务自动失败，集体抹杀处理）。 \n即便法术成功，你也需要以自身为引，这不但会带走你的所有魔力，也会带走你的大量生命力，你的魔力清空，且在一年时间内视为没有魔力槽（你可以通过主神购买回复，价值3650分），并受到等同于你生命值的严重伤害，若你死于该伤害或施法时魔力不足18点，视同法术失控。 \n若最终施法成功，你对范围内所有你选择的目标造成相当于你智力+神秘+本法术威力的混沌恶性伤害，该伤害不可避免，但可以被临时生命吸收。并结束范围内所有其他不高于S级的能力产生的效果，这些效果超出本法术范围的部分不会被结束。（例如火墙术可能只被吃掉一半）。"},{"name":"霹雳塔","schools":["塑能"],"grade":"S","power":"48","price":"S+8000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"霹雳塔 \n专业：塑能 \n威力：48 \n价格：S+8000 \n动作：标准 \n能耗：9 \n成分：姿势，语言 \n射程：10*智力*威力米 \n范围：5*智力*威力米 \n持续：立即 \n效果：该魔法可以连续产生大规模落雷，同时令更大范围内物质的绝缘性大幅下降，在该魔法的范围内电子机器的电线绝缘性低落引起绝缘破坏（短路），再加上电磁波的影响（电磁感应、电磁脉冲）导致损坏扩大。 \n选择射程内一点为中心，法术范围为半径球形区域内，产生等同法术威力的电击严重伤害，反射豁免。 \n并在10倍范围内产生等同法术等级的EMP力场效果，见物品关键字所述。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"光亮术","schools":["变化"],"grade":"无支线","power":"1","price":"","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"光亮术 \n专业：变化 \n威力：1 \n动作：标准 \n成分：姿势，语言 \n射程：接触 \n范围：智力*5米 \n持续时间：智力*1分钟 \n效果：你可以让一个物体发出柔和的光芒，使其照亮法术范围内的区域。"},{"name":"完好如初","schools":["变化"],"grade":"无支线","power":"1","price":"","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"完好如初 \n专业：变化 \n威力：1 \n动作：标准 \n成分：姿势，语言 \n射程：接触 \n持续时间：立即 \n效果：本法术可用于修复损毁的物体，你接触一个无支线且体积不高于6的物体，若在你视线中的该物体的构成部分未被他人持有，则这些构成部分会飞向你视线中最大的该物体组成部分并完成拼合并修复，若物品的所有构成部分都在你视线范围内（哪怕它已经被打成粉末），那么物品被修复完好，否则物品会被修复至其最大可能的形态。本能力不能修复消耗掉的物品使用次数（包括消耗品）。 \n若用本能力修复尸体到完好形态，则一些需要完整尸体的能力可以被正常作用，但是尸体作为物品的支线等级取决于尸体拥有的最高级强化的等级。 \n若你消耗1点魔力，本法术可以修复任何非消耗品1点生命值，但其不能已经处于被摧毁的状态，并且修复的场景与受到伤害的场景不能存在间隔。（因此战斗结束后立刻修复载具是可以的，但若离开了战斗结束后的场景，就无法再修复。）"},{"name":"射矢术","schools":["变化"],"grade":"无支线","power":"1","price":"","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"射矢术 \n专业：变化 \n威力：1 \n动作：标准 \n成分：姿势，法器（要投掷的物品） \n射程：智力*10米 \n效果：你将手中的微小物品作为弹药发射出去。 \n要使用此法术，你必须持有一个体积为1或更低的投掷武器或弹药。 \n施法后，你向射程范围内一个目标发起一次以智力+神秘学进行的远程攻击，武器伤害等同法术威力（除非原有武器为投掷武器且伤害更高）。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"幻色之风","schools":["变化"],"grade":"无支线","power":"1","price":"","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"幻色之风 \n专业：变化 \n威力：1 \n动作：标准 \n射程：接触 \n持续：神秘学等级*1天 \n效果：选择接触到的一个体积不超过5的对象，角色可以调整它各部分的颜色，这是一个无支线等级的幻术效果。 \n它不能覆盖反侦测等级，拥有反侦测等级的对象即使受到本效果作用，反侦测等级也不会被破坏 \n它可以调色至与环境一至来获得D级反侦测等级，但如此获得的反侦测等级在对象发生了任何原因的移动（包括被动移动，例如物品被拿着走）或行动后自动 力值点硬度和法术威力值*5点生命值的物体，其出力和机动视为法术等级*5，体积为11，因此体积调整为3，具有以下特性 \n1.月灵髓液是液体，其体积可以在总体积不变的情况下任意改变，月灵髓液免疫非魔法物理伤害，它可以流过任意大小的缝隙。 \n2.施法者可以以自由动作对其下达一些指令，每个指令视为一个单独的行为，因此你可以在一个回合中把所有指令都下达一次，除非指令本身存在冲突。 \n-移动指令：月灵髓液移动等同你速度的距离，若其出力足够，可以变成任何形状来抬起你和你选择的目标，它至多能将你们纵向移动330米，这不是飞行能力。 \n-攻击：月灵髓液对至多等同体积*30米范围内的所有你选择的目标发起一次攻击，它将成为各种奇怪的形状来攻击你选择的敌人，这次攻击使用你的施法判定进行，武器伤害等同法术威力值，造成钝击，挥砍或穿刺严重伤害，具有魔法特性，能应用的施法关键属性不超过月灵髓液的出力值。 \n你也可以让月灵髓液发起擒抱，摔拌，击落武器判定，你使用施法判定来进行擒抱，摔拌判定，月灵髓液在这些判定中获得等同法术威力值的加值，月灵髓液擒抱成功时，自身不处于擒抱状态，月灵髓液压制成功时，可以侵入对方体内（对载具而言则是驾驶舱内），发挥水银的毒性，使目标每轮受到等同法术威力值的毒素严重伤害，视为等同法术等级的毒素，还能从体内对目标发起攻击（对载具而言可以攻击驾驶员），这视为目标无法应用闪避，格挡，基础防御，和任何物品带来的伤害吸收减免抵消。 \n-防御：月灵髓液拦截针对至多等同体积*30米范围内一个或多个目标的攻击，这视为它会在这些目标受到攻击时变成各种各样的形状为这些目标攻击完全阻挡，也包括范围伤害，它会直接拦截范围伤害本身，而不是对每个目标单独计算。应用其自身的硬度和生命值。 \n-索敌：月灵髓液可以尽力延展自身，为你提供知觉，月灵髓液的知觉形式为盲视，且无视任何有缝隙的障碍物阻挡，距离至多330米，但这不视为你本身的视觉，存在被欺骗的可能（例如时间魔术就拥有这个能力）。使用索敌的同一回合中无法下达攻击和防御指令。 \n注意：强化施法材料的水银不会改变月灵髓液的数据，月灵髓液也不能进行物品改造。"},{"name":"灵魂连接","schools":["变化"],"grade":"B","power":"12","price":"B+2000","kind":"能力组","source":"术士","bucket":"视为通用","body":"灵魂连接 \n专业：变化 \n威力：12 \n价格：B+2000 \n动作：迅捷动作 \n能耗：5 \n成份：姿势，语言 \n射程：10米*智力值*法术威力 \n范围：无 \n持续：一个场景 \n效果：在你和恶魔之间连接起一道看不见的灵魂通道，每当你受到伤害时，你和你召唤的恶魔分摊本次伤害，若为单数，则直接目标承受多出来的1点。该效果应用于实际伤害结算后，因此另一个生物的防御能力无法再次应用 \n将此法术升阶到A级，可变为将效果应用于所有防御结算之前。"},{"name":"石化术","schools":["变化"],"grade":"B","power":"12","price":"B+2000","kind":"血统","source":"雅娜斯特（魔语者）","bucket":"视为通用","body":"石化术 \n专业：变化 \n威力：12 \n价格：B+2000 \n动作：标准动作 \n能耗：5 \n成分：姿势，语言 \n射程：10米*智力值*威力值 \n范围：无 \n持续：立即 \n效果：美杜莎赖以成名的绝技。 \n你进行一次施法判定，将法术威力作为DP加入判定中，目标进行强韧豁免，你对其造成胜出数一半的晶化点数，可以叠加。 \n本法术是一个变形类效果。"},{"name":"祝祷","schools":["变化"],"grade":"B","power":"12","price":"","kind":"能力组","source":"幻术师和白魔法师","bucket":"视为通用","body":"祝祷 \n专业：变化 \n威力：12 \n动作：迅捷 \n能耗：5点魔力 \n成分：语言，姿势 \n射程：10米*智力*威力值 \n效果：你反复咏唱元灵之名，使魔力的引导变得更为容易，并能在合适的时机爆发，给予高强度的庇护能力。 \n学会此法术后，你在使用治疗，医治，愈疗，医济时能使自身获得1层【神名】，至多持续一个场景。 \n每层神名让你在使用幻术师能力组下的法术时，法术威力增加1点。 \n使用本法术时，消耗你所有的神名层数，选择一个射程内的目标，目标获得等同于法术威力+神名层数*2的临时生命值。 \n特殊：同时具有神名时，神名层数叠加 \n\nA级"},{"name":"神名","s 离，只有在原处的阵地依然有效。你也可以直接将足够宽敞的载具等做成阵地。 \n当你处于自身阵地中时，获得以下好处 \n1.你的法术威力值提升等同本法术威力值/3 \n2.你消耗魔力时减少等同本法术等级的消耗数 \n3.你在防御和豁免判定中获得等同法术威力值的环境加值 \n若你的法阵的持续时间为天级，你还获得以下好处 \n1.阵地的魔力为你提供强大的防护措施，在阵地中，你视为拥有等同法术威力的硬度和等同法术威力*2的临时生命值。你可以在攻击掷骰前决定是否使用这个临时生命值，这个临时生命值若耗尽，视为法术结束，不使用临时生命值，也就无法适用硬度，并且该硬度在破甲时优先被扣除而非最后扣除 \n2.阵地提供一个魔力池，等同你创造这个阵地投入的总魔力。你可以用两种方式使用它，若你消耗的能量到达你投入法阵的能量，法术结束： \n——你可以用阵地中的能量为你移除状态点数，你投入的能量每点可以为你抵消2点任意状态点数，在受到状态点数的同时宣言要使用的能量值 \n——以一个标准动作，你消耗3点阵地中的魔力排斥外敌，所以你选择的处于阵地中的生物会受到精神束缚点数等同本法术威力值，没有豁免。你必须以某种形式感知到了这些目标。 \n若你的法阵的持续时间为永久，你还获得以下好处 \n1.任何拥有能量池的生物，或消耗能量产生的效果出现在阵地的任意位置时，你自动知晓，以一个移动动作，你可以将意识投射到法阵中的任意点仿佛你本人就在该点上一般，使用你自身的感官观察。 \n2.当你需要使用魔力时，你可以使用法阵的魔力，法阵的魔力每24小时回复到最大值。 \n3.当你拥有多个阵地时，以一个标准动作消耗每个生物5点你所在阵地的魔力，将这些在你所在阵地中的生物转移到其他阵地中，不必将所有生物转移到同一阵，只有自愿生物能接受这一效果，这视为一个B级传送效果。 \n4.法阵魔力全部消耗时，法术也不会结束，而是等待魔力回复。 \n本法术效果本身视为等同法术价格的物品来计算硬度与生命值，造成范围伤害的效果可以对本法术效果造成伤害。 \n若法阵中具有魔力，在受到伤害时每支付1点法阵魔力即可抵消2点伤害。 \n若法术效果被摧毁，本法术立即结束。 \n特殊的，要享受阵地做成带来的效果，阵地的体积不能小于角色体积的25倍，因此正常体积5的角色需要体积125的阵地，亦即直径约40米，半径约20米的阵地。"},{"name":"全大赦","schools":["变化"],"grade":"A","power":"24","price":"","kind":"能力组","source":"幻术师和白魔法师","bucket":"视为通用","body":"全大赦 \n专业：变化 \n威力：24 \n动作：迅捷 \n能耗：7点魔力 \n成分：语言，姿势 \n射程：10米*智力*威力值 \n效果：你将每次引导的生命力分出些许用于维持引导通道，使你进一步引导变得更为容易，并获得在瞬间使用这些生命力的可能。 \n学会此法术后，你在使用任何对目标产生治疗点数或快速医疗的幻术师下的法术时，目标会获得1层【告解】，每个法术只会产生1层告解，告解至多持续一个场景，目标身上的每层告解会提升目标受到的能产生告解的法术威力2点。 \n使用本法术，选择一个射程内的目标，消耗目标身上的全部告解层数（至少 \n1层），目标获得等同于法术威力+告解层数*4的治疗点数，每4点治疗点数可治疗1点恶性伤害，1点治疗1点严重，冲击伤害或任意不良状态。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"时光倒流","schools":["变化"],"grade":"A","power":"24","price":"A+4000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"时光倒流 \n专业：变化 \n威力：24 \n价格：A+4000 \n动作：特殊 \n能耗：7 \n成分：姿势，语言 \n射程：特殊 \n范围：特殊 \n持续：立刻 \n效果：你可以有限度的将时间倒退，本能力有数种用法： \n1.单目标时间倒退，这是一个标准动作，选择一个10米*智力*法术威力值范围内的目标，该目标的所有状态（如能量池，生命值状态，身上的持续效果时间等）全部变为上轮其轮结束时的状态，该效果基于时间法则，这一言灵有可能部分改变已发生的事实，例如原本死亡的战士现在其实并没有死。若你改变了一个已经影响任一轮回小队成员支线奖励或分数的事实，这一影响不会被辙消或重复。（例如，你的队伍杀死剧情人物得到C+1000，你以此法术改变该剧情人物的死亡使之生存，不会使你已得到的C+1000被收回，任何人再次杀死他也不会得到奖励。） \n2.全影片时间倒流，这是一个标 上，你可以事先自行创作基于两个法术的混合的效果，该效果依然需要得到ST的同意，之后你在双腕掌握融合这两道法术时，可以释放这个新效果以结束法术效果，而非单独释放那两道法术。ST可以自行决定作出这种调整的价格。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"祈祷","schools":["附魔"],"grade":"A","power":"24","price":"A+4000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"祈祷 \n专业：附魔 \n威力：24 \n价格：A+4000 \n动作：整轮 \n能耗：7 \n成分：语言，姿势 \n射程：自身 \n范围：10米*智力*威力值 \n持续：一个场景 \n效果：法术范围内的所有生物，生命上限提升法术威力*5/3点，所有判定和防御上获得法术威力点士气加值。 \n本法术影响的目标若具有光明生物层级或黑暗生物层级，将光明生物层级减去黑暗生物层级，若只有部分，则没有的视为0。若结果至少为0则法术有效，结果高于1则法术效果加倍 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"圣域术","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"圣域术 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：标准 \n能耗：1点 \n成分：姿势，语言 \n射程：接触 \n持续时间：一个场景 \n效果：神圣的力量化为守护目标的结界，直到目标作出恶行。 \n选择一个法术射程内的自愿目标，受术者受到神圣力量保护，任何造成伤害或状态点数的效果无法将受术者取为目标，除非该效果的使用者通过DC等同法术威力的意志豁免，每次试图影响受术者都需要进行判定，若判定失败，行动被浪费，但如有能量，物品等消耗不会消耗，无法取消行动或改变目标。不需要取目标的效果不受影响（如范围效果） \n受术者同样不能造成伤害或是状态点数，否则本法术效果就会立刻终止。"},{"name":"护盾","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"护盾 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：标准动作 \n能耗：1点 \n成分：动作，语言 \n射程：无 \n范围：特殊 \n持续时间：标准动作维持 \n效果：这是贝尔卡式法术中最基本的战斗法术，因为如此常用，很多魔导师将这个法术登录在他们的魔导器中，作为常备的防护力来使用。 \n你的手上展开由光纹组成的魔法阵（圆形或旋转的三角形），阻挡攻击，你可以调节你的法阵大小，至多完全覆盖你的触及范围，本法阵不会影响被保护的目标做出的攻击。 \n法阵本体拥有相当于威力值的硬度和威力值*2的临时生命值，若一个攻击或范围伤害试图影响被法阵保护的目标，它必须首先击穿法阵，才会影响到法阵后的生物，若是范围伤害，所有被法阵保护的目标都会被减轻影响。 \n对于单体攻击，视同攻击者先对没有防御的法阵发起了一次攻击，若造成的伤害没有击破法阵的临时生命，那么没有对被保护的目标造成伤害，如果成功击穿，那么在攻击和伤害上限中受到等同法阵临时生命值的减值。 \n对于范围攻击，视同攻击者先对没有防御的法阵发起了一次攻击，若造成的伤害没有击破法阵的临时生命，那么没有对被保护的目标造成伤害，如果成功击穿，那么范围伤害减少等同法阵临时生命值。 \n若你的回合开始时，法阵还没有被完全击溃，并且你决定以标准动作维持，你可以投入等同法术等级的魔力消耗将法阵临时生命恢复到最大。 \n额外消耗法术等级*2点意志，你可以以反射动作使用此法术。"},{"name":"收纳术","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"收纳术 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：特殊 \n能耗：1点 \n成分：语言，姿势 \n射程：无 \n持续时间：永久 \n效果：你能创造一片用于存储物品的异次元空间。 \n在最初的等级，储物空间的生成是永久的，会占用1点魔力上限，每次使用这个能力会以你为锚点开辟一片体积为10的储物空间，只能存储物体，你需要接触想存储的物体，并适用通用的储物空间限制。 \n开辟空间和销毁空间都是标准动作，从空间中存取物体都是移动动作。 \n本法术若意外结束，所有收纳空间中的内容都会在离你最近可容纳其的位置中随机出现。 \n升阶： \n本能力升阶至C级时，可以将所有闭锁空间联通，成为一个大体积的闭锁空间，例如你之前占用10点魔力上限开辟了10个10体积的储物空间，现在变为一个100体积的闭锁空间 \n同时，能力占用的魔力上限减半，在上例中，现在100体积的闭锁空间仅占用5点魔力上限。 \n本能力升阶至B级时，生物也可以进入这一储物空间，你可以以标准动作收纳自愿或无助的生物，并以另一个标准动作将其取出在你的相邻位置。 \n本能力升阶至A级时，你可以生成广域异次元空间，这是一个标准动作，消耗7点魔力，展开以自身为中心，半径5*智力*威力值米的异次元空间区域，区域内所有无支线未被使用或携带的物体会在异次元空间区域内出现真实投影，可以被正常使用，也具备通常物体的效果，如建筑材料或环境，更高级未被使用或携带的物体不会出现在空间中，被使用和携带的物体则跟随生物决定是否出现。所有生物则由你选择被哪些被捕捉进入异次元空间。但若这些生物在共用一件物品（如载具），那么所有共用物品的生物必须得到统一的结果，或者全部被捕捉，或者全部没有。该效果持续一个场景。 \n你展开该空间时所在的位置即为该空间所在的锚点，若有追踪锚点进行攻击的能力，可以直接伤害到你，传送的话则是落在你身边。 \n该空间与主位面无法正常出入和互相观测，必须通过能跨位面移动的传送手段才能出入。 \n该空间不会跟随你移动 \n该空间可以被物理打破，攻击结界边缘即可视为攻击结界本体，将结界本体视为等同本能力总价格的物体处理。 \n本能力升阶至S级时，你生成的空间可以覆盖整个城市，其半径变为50*智力*威力值。你可以设置一些筛选条件来拉入看不见的生物，例如没有超凡属性的生物不被拉入，你只能以属性，衍生属性，最高能量池等级，生物种类来做区分"},{"name":"法力护盾","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"法力护盾 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：标准动作 \n能耗：1 \n成分：姿势，语言 \n射程：自身 \n范围：无 \n持续：一个场景 \n你使用魔力为自己形成一层可以吸收伤害的法力护盾，当你受到伤害时，你视同拥有临时生命值般将该伤害吸收一半，每以此方式提供威力值/2点临时生命会消耗法术基本消耗点魔力。因此产生的消耗无法以精力代付，能量为0时护盾自动失效，未被吸收的伤害也照常产生，解除护盾是一个自由动作。由于临时生命无法叠加，已有其他临时生命时本法术失效 \n额外消耗等同法术基本消耗两倍的意志，你可以以反射动作施展这道法术。"},{"name":"法师护甲","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"法师护甲 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：标准动作 \n能耗：1点 \n成分：语言，姿势 \n射程：接触 \n持续时间：1小时*智力值 \n效果：选择法术射程内一个目标，目标获得等同于你威力值*2的盔甲防御值，这个防御对灵体的攻击也有效。若目标原本有生效且更高的盔甲防御，那么本能力获得的防御值变为抵消破甲值，这不视为生物穿着了盔甲。"},{"name":"混沌晶壁","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"混沌晶壁 \n关键字：【光】 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：标准 \n能耗：1 \n成份：语言，姿势 \n射程：自身 \n范围：5米*智力值*威力值 \n持续：1轮/智力值 \n效果：围绕施术者，出现水晶般的透明防壁，和大型法阵和咒字在上面显现。该防壁法阵跟随你移动，会阻止所有试图伤害你和你友军的攻击。 \n你和以你为中心，半径等同范围的球形区域内的友军在防御和反射上获得掩蔽加值等同威力值。并获得等同威力值/3的全能量抗力 \n额外消耗法术等级*2点意志，你可以以反射动作启动此法术。"},{"name":"漆黑光盾","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"能力组","source":"星刻的龙骑士","bucket":"视为通用","body":"漆黑光盾 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：反射动作 \n能耗：1点 \n成分：动作，语言 \n射程：自身 \n范围：无 \n持续时间：1轮或你做出任何行动 \n效果：你创造出能抵御伤害的光膜 \n你获得3+法术威力*2的临时生命和等同法术威力*2/3的全伤害吸收。"},{"name":"物理盾","schools":["结界"],"grade":"D","power":"","price":"","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"物理盾 \n威力值：3 \n价格：D+500 \n专业：结界 \n成分：语言，动作 \n动作：标准 \n消耗：1 \n范围：自身 \n持续时间：1轮*智力值 \n效果：你获得了一个物理伤害吸收护盾，这是一团你体表的、可见而不刺眼的透明光幕。 \n你获得全伤害吸收等同法术威力值/3。 \n额外消耗法术等级*2点意志，你可以以反射动作使用此法术。 \n当你受到伤害时，可以以一个反射动作完全激发法术效果，对本次伤害效果提升至威力值*3，如此使用后，法术立刻结束，这个效果也可以和消耗意志结合，这样只需要一个反射动作就能完成施法和激发。"},{"name":"生命之力","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"能力组","source":"星刻的龙骑士","bucket":"视为通用","body":"生命之力 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：特殊 \n能耗：1点 \n成分：动作，语言 \n射程：接触 \n范围：无 \n持续时间：特殊 \n效果：你激发目标的机体活力，使其在休息中获得更多益处。 \n本法术的施法动作与一次短休息或长休息结合，且本法术无法对自身施展，你需放弃那次短休息或长休息的好处。 \n若进行的是短休息，目标将在短休息完成后恢复所有严重或冲击伤害，并回复等同法术威力的恶性伤害，同时额外移除所有状态点数等同法术威力点，以及回复等同法术威力/3的意志值和精力值。 \n若进行的是长休息，目标将移除所有恶性伤害。 \n\n骑龙演舞 \n传承自耶库布莱德的骑龙技法，利用龙族的机动性与速度，在广阔的区域内以龙魔力绘制壮绝的巨大法阵，并以自身的星精将法阵固定，无论在广阔的空中亦或海上都能如常使用，巨大的法阵推动让骑龙演舞一旦成形便有难以想象的威力和范围。 \n比起施法，骑龙演舞更像是刻下将星球力量转换为特定用途的阵法，使用骑龙演舞需要龙骑士和龙的全心结合，若需要判定，采用风度+动物沟通（骑术）进行判定。 \n骑龙演舞的动作要求并不固定，它实际需要的是按照特定的轨迹移动足够多的距离，骑龙演舞可以（甚至一般必然是）分摊到多个回合上完成，在尝试完成骑龙演舞的每个回合中，龙骑士的坐骑都必须采用双移动并支付等同基本消耗的龙魔力来完成法阵，若双移动完成法阵后有剩余移动距离，可以正常继续移动，而龙骑士自身则只需要以一个移动动作支付等同基本消耗的星精来驾驭坐骑，任何一个回合中若无法维持所需动作，骑龙演舞就会失败，已经投入的魔力和星精被浪费掉，必须重新绘制。此外，被迫移动和定向移动（例如受到冲撞，或是直线移动类能力）都会同样打断骑龙演舞。 \n骑龙演舞的影响区域通常是一个圆柱体，其底面半径由你的属龙绘制法阵的飞行的距离和轨迹决定，长度等同半径的2倍，方向总是垂直于底面。 \n你和你的属龙在启动骑龙演舞的第一回合就必须宣告要绘制的法阵半径，不能在施展过程中再做修正。 \n骑龙演舞本质上是一种合作技巧，你和属龙都必须掌握骑龙演舞才能使用。 \n\n净化蜜雨（5XP） \n前提：C级星刻的龙骑士或其属龙 \n底面半径：移动距离/8，至少10米（也就是80米移动距离，以产生底面半径10米，长度20米的圆柱体） \n基本消耗：1 \n骑龙演舞绘制的法阵完成后，法阵影响区域内将降下纯净神圣能量的光雨 \n区域内所有不死生物，虚体或灵体生物，黑暗生物受到16点神圣能量严重伤害，具有魔法，幽冥特性，反射豁免。 \n区域内所有活物获得8点医疗点数，每1点医疗点数能回复1点严重或冲击伤害，或者每4点回复1点恶性伤害。 \n\n断枪破雨（5XP） \n前提：C级星刻的龙骑士或其属龙 \n底面半径：移动距离/8，至少10米（也就是80米移动距离，以产生底面半径10米，长度20米的圆柱体） \n基本消耗：1 \n骑龙演舞绘制的法阵完成后，法阵影响区域内将降下锐利的光枪 \n区域内所有目标受到16点纯能量严重伤害，具有魔法，幽冥，超级贯穿特性，反射豁免，并击破4点任意来源伤害减免，吸收或硬度。 \n\n双翼誓雨（5XP） \n前提：任意其他骑龙演舞 \n若你和你的属龙都拥有本能力，将允许你和另一组拥有本能力的星刻龙骑士及其属龙联合使用双方均能使用的骑龙演舞。 \n当你发起一项骑龙演舞时，拥有同一能力的人需要立刻确定是否加入，若其确定加入，则他的回合中也开始执行骑龙演舞所需的动作和消耗。 \n你们两方的移动距离叠加计算以确定是否完成底面半径，但轨迹仍需吻合 \n法阵完成时，该法阵会触发两次效果。 \n\n焦热的星天雨（10XP） \n前提：C级星刻的龙骑士或其属龙 \n底面半径：移动距离/8，至少20米（也就是160米移动距离，以产生底面半径20米，长度40米的圆柱体） \n基本消耗：2 \n骑龙演舞绘制的法阵完成后，法阵影响区域内将降下具有追踪性能的光束，轰击你的敌人 \n区域内所有敌方目标受到20点纯能量严重伤害，具有魔法，幽冥特性，该伤害无法豁免。 \n\n棘冠戒雨（10XP） \n前提：C级星刻的龙骑士或其属龙 \n底面半径：移动距离/8，至少20米（也就是160米移动距离，以产生底面半径20米，长度40米的圆柱体） \n基本消耗：2 \n骑龙演舞绘制的法阵完成后，法阵影响区域内将如瀑布般降下由魔力构筑而成荆棘缠绕区域中所有你选择的目标 \n所有你选择的目标受到20点纠缠点数，以及所有肢体受到20点肢体妨碍，反射同时豁免两者。 \n因此效果产生的状态点数至多维持一个场景。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"精神护甲","schools":["结界"],"grade":"D","power":"","price":"","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"精神护甲 \n威力值：3 \n价格：D+500 \n专业：结界 \n成分：语言，动作 \n动作：标准 \n消耗：1点 \n射程：10米*智力*威力值 \n持续时间：一个场景 \n效果：你唤醒目标的内心精神，形成壁垒阻挡了对其身体的入侵。 \n选择一个法术射程内的生物，目标获得法术威力*2点防御上的力场加值，法术威力/3点硬度和全伤害吸收，免疫等同法术等级的影响心灵效果。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"警报术","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"警报术 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：1分钟 \n能耗：1 \n成分：姿势，语言，法器（一个小铃铛和一小段线） \n射程：接触 \n范围：智力*法术威力*10米 \n持续：智力*1小时 \n你针对不速之客设置一个警报。你接触一个目标，法术持续期间内，任何进入范围的，体积为2或更高的生物会触发 \n警报，施法时你也可以同时接触任意数量目标，这些目标不会触发警报。 \n你在施法时还能选择警报方式是声音警报或精神警报，若是精神警报，触发时若你在法术范围内，你在意念中会收到 \n信号。若是声音警报，则法术范围内响起持续一轮的警铃声，由你设定。 \n无论如何，该警报足以将范围内的目标从通常睡眠中唤醒。"},{"name":"邪甲术","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"邪甲术 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：标准动作 \n能耗：1点 \n成分：语言，姿势 \n射程：自身 \n持续时间：1小时*智力值 \n效果：你被邪能之力笼罩，效果生效期间，你的法术威力增加等同本法术威力的1/3。同时你获得等同法术威力值*2/3的亵渎防御 \n本法术效果持续期间，无法再使用同名法术，即使是不同等级的法术也一样。 \n本法术威力不受任何临时性威力提升影响，包括有持续时间的提升效果，以及来自物品的提升效果。"},{"name":"防御结界","schools":["结界"],"grade":"D","power":"3","price":"D+500","kind":"血统","source":"龙（猎龙者拉格纳）","bucket":"视为通用","body":"防御结界 \n专业：结界 \n威力：3 \n价格：D+500 \n动作：标准 \n能耗：1点魔力 \n成分： 只会触发一次，但是你可以让其不立刻触发，而是在有生物踏入时才触发，这个效果至多持续等同法术持续时间"},{"name":"消隐无踪/急急现形","schools":["幻术"],"grade":"无支线","power":"1","price":"","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"消隐无踪/急急现形 \n专业：幻术 \n威力：1 \n动作：标准 \n成分：姿势，语言 \n射程：接触 \n持续时间：特殊 \n效果：本法术用来隐藏物体表面的图案或字迹，也能让你揭示他们。 \n你在接触物体时施展此法术，可以隐藏物体上任意数量的文字或图案，因此你能让一本书看起来全是白纸一般，这个效果视同一个无支线的视觉幻术效果，你可以任意设定隐藏的数量和时间，设置为永久也可以，你也可以在手持物体时用本法术解消同类的无支线视觉幻术效果以恢复其原本的文字。 \n本法术无法隐藏本身具有力量的文字或图案，例如能使附近人瘫痪的痛苦徽记，魔鬼和人签订的灵魂契约，死神的约定或是转队文书等等。 \n本能力在隐藏文字或图案后，可以填充新的文字和图案上去，如此一来你在使用本法术解消之前的效果时，会隐藏后填充的文字，限制同前。"},{"name":"杰斯的幻象","schools":["幻术","精神"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"杰斯的幻象 \n专业：幻术，精神 \n威力：3 \n价格：D+500 \n动作：标准 \n能耗：1点魔力 \n成分：语言，姿势 \n射程：自身 \n范围：无 \n持续：一个场景 \n效果：「你明知这不是真的，但当它向你挥爪，你知道些什么可一点也不重要。」 \n你创造出一个任意外形的视觉幻象，通常是某种武器或天生武器的样子，体积上限与你相同。 \n每轮一次，你可以以自由动作让幻象向一个射程等同你的智力*法术威力*10米范围内的目标发起攻击，这次攻击以施法判定进行，武器伤害视同法术威力*2点，具有魔法，正常影响灵体特性，造成精神严重伤害，并因此根据精神伤害相应规则无视一些防御而是让目标将意志加入防御中。 \n这个法术并非纯粹的幻术，免疫视觉幻术或影响心灵效果能让伤害下降至冲击伤害，两者都免疫则无视本法术影响。"},{"name":"杰斯的觅灵影","schools":["幻术","精神"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"杰斯的觅灵影 \n专业：幻术，精神 \n威力：3 \n价格：D+500 \n动作：标准 \n能耗：1点魔力 \n成分：语言，姿势 \n射程：自身 \n范围：无 \n持续：永久 \n效果：你可以创造一个外形如同细长鱼类的幻象，追迹一个目标 \n作为施法的一部分，你要么接触着一件目标是最近一个携带其超过一天的物体，要么正以某种手段阅读他人的记忆并从记忆中确定了目标的正确姓名与详细外貌。 \n施法完成后，一条鱼类幻象会出现在你身边，若目标还在本位面，鱼类幻象会以最短距离游向目标并无视任何障碍。其每轮会移动等同你速度的距离。 \n当幻象到达目标后，就会始终跟随目标并缠绕在目标的位置上，这不会对目标造成任何影响，但你获得了目标所在位置的模糊定位。 \n幻象成为任何攻击或效果的目标时，自动消散并结束法术。 \n幻象离开你的距离超过你的智力 \n*法术威力*10米时自动消散并结束法术。"},{"name":"虚假幻象","schools":["幻术"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"虚假幻象 \n专业：幻术 \n威力：3 \n价格：D+500 \n动作：标准 \n能耗：1点 \n成分：语言，姿势 \n射程：智力*威力值*10米 \n范围：无 \n持续时间：智力*1分钟 \n效果：你在目标地点创造出一件物体的虚假幻象。使用时进行一次施法判定。 \n作为虚假幻象，该效果可以被直接或间接观测，物体也可以正常记录这个幻象。 \n触碰幻象会直接穿透过去，攻击也一样，这会让人直接识破这是幻象 \n幻象只能仿造出你见过或你想象中的东西，但你不能用来创作你自己不知道的东西。 \n最初的幻象只有外形，影子，声音，气味和温度。 \n以一个标准动作，你可以操控幻象进行一个改变，你可以在法术射程范围内任意进行这个改变（例如移动，变形，攻击等）。尽管你可以操纵幻象，但幻象并不会将其感知反馈给你。 \n如果幻象需要进行判定（例如你操纵幻象和人交涉），使用你的该类判定，判定结果至多不能超过施法判定结果。 \n法术升阶到C级时，幻象变得更加真实，操纵也更加灵活，其持续时间变为智力*10分钟，幻象会具备触觉，对幻象造成近战伤害时才能感受到手感异常从而识破，否则单纯的触碰以及对远程伤害无法识破，幻象会对攻击表现出由你选择的互动性（他可以因为伤害而装作受伤，甚至死亡，也可以在受到伤害时表现出毫发无伤的样子，但你首先需要有能力知道其受到伤害，例如其在你模糊视觉范围内），现在操控幻象是一个移动动作，此外，你可以将这层幻象“贴图”在真实物体上来伪造它的样子，这时它不再静止，而是完全依附于被贴图的真实物体而行动。你可以用这种方式改变一个人的相貌，或是物体的模样，这甚至能改变外观大小，但可能出现一些穿模问题。 \n法术升阶到B级时，持续时间变为智力*1小时，操控幻象变成迅捷动作，你能创造的幻象不再局限于一件物体，而是将法术射程变为“范围”，在射程范围内创造任意数量的幻象，也包括了场景幻象，并将场景幻象贴图到真实世界之中。你在操控幻象时可以同时操控环境的全部或局部。 \n法术升阶到A级时，持续时间变为永久，操控幻象不再需要动作，你创造出的幻象可以是永远自行处于某种你预设的运动状态，并且幻象会根据你的预先设定，针对情况作出互动反应。"},{"name":"镜像","schools":["幻术"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"镜像 \n专业：幻术 \n威力：3 \n价格：D+500 \n动作：标准动作 \n能耗：1 \n成分：姿势，语言 \n射程：自身 \n范围：无 \n持续：一个场景 \n施法者在身周创造等同法术威力值的镜象并让自己成为他们之一，法术创造出威力值个镜像，该效果是一个等同法术等级的视觉幻术效果，若攻击者没有识破幻术能力，在进行单体攻击时需要进行1D镜像数量+1的判定，若不为1，攻击自动击中镜像，镜像消失。 \n在面对范围伤害或一次攻击中包含多个对象的攻击（如连射），镜像视为拥有两倍法术威力的临时生命值，且完全适用你的相关判定或结果（如反射或防御），若伤害足以击破幻象，那么那些幻象全部消失，否则幻象看起来会和施法者一样，无法分辨。"},{"name":"隐形术","schools":["幻术"],"grade":"D","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"隐形术 \n专业：幻术 \n威力： 3 \n价格：D+500 \n动作：标准 \n能耗：1点 \n成分：姿势，语言 \n射程：接触 \n持续时间：一个场景 \n效果：你消去受术者的身形。 \n选择一个法术射程内的自愿目标，受术者获得反侦测等级，等同法术等级 \n+1，若其攻击未发现其的受害者，造成的措手不及等级等同法术等级。"},{"name":"幻影面纱","schools":["幻术","精神"],"grade":"C","power":"3","price":"D+500","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"幻影面纱 \n专业：幻象和精神 \n威力：3 \n价格：D+500 \n动作：标准 \n能耗：1点 \n成分：姿势、语言 \n射程：触及范围内的1个生物 \n持续时间：24小时 \n描述：某个枪火与黄沙的世界中，一名流浪的强盗所擅长的魔法。在其掩蔽之下，即使是最亲密的同伴也没能看穿他的伪装。 \n效果：法术持续时间内，目标生物的所有特征被隐藏起来，其他生物虽然能如常看到目标生物，但其身高、外貌、外形等需要视觉确认的信息皆呈现为黑影或马赛克，即使通过监视器、镜子、摄像机等手段间接观测或留下影像，其中也只会显示模糊的黑影或马赛克。 \n这视为一个法术等级+1的视觉幻术和影响心灵效果，直接观测的生物需要同时免疫两者才能看穿，间接观测的生物只需要免疫影响心灵效果即可。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"海市蜃楼","schools":["幻术","结界"],"grade":"C","power":"6","price":"C+1000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"海市蜃楼 \n专业：幻术，结界 \n威力：6 \n价格：C+1000 \n动作：10分钟 \n能耗：5 \n成分：语言，姿势 \n射程：自身 \n范围：模糊视觉范围内 \n持续：24小时 \n效果：你使模糊视觉范围内的地形在视觉、听觉、嗅觉、甚至触觉上都像是某种其它的地形。你可以让开阔的平原或者一条路可能变得像一片湿地，一座小山，一个裂谷或是其它困难或无法通行的地形。你还可以让一个池塘变得像一片茂盛的草地，一个悬崖变得像一个缓坡，或者让一个乱石沟变得像一条宽阔平坦的大路。 \n另外，你还可以改变建筑物的外观，或者在本来没有建筑物的地方添上建筑物。该法术不可以伪装、隐藏或增添生物。 \n\n该幻术是听觉、视觉、触觉和嗅觉的综合体，因而其可以把空旷的地面变成困难地形（或者反过来），甚至使之变成无法通行的区域。幻象地形的任何一小部分（例如一块石头或者一根树枝）被移动到法术区域外时都会立刻消失不见。 \n这是等同于法术等级的幻觉效果，拥有真实视觉的生物可以看穿幻术，洞悉地形的真实形态；然而幻象的所有其它元素仍会得以保留，所以一个意识到这是幻象的生物仍然可以与该幻象进行物理互动。免疫本幻觉的能力可以随时选择无视本幻觉，但是之后无法再选择和本幻觉产生互动。 \n生物在看到，进入，发现地形存在异常（例如攻击从墙后飞来）时，有三次机会进行意志豁免，难度等同本法术威力，来看穿这是一个幻术效果，若未看穿，他也可以正常攻击法术产生的阻挡，这视为试图击破法术整体，法术整体的生命值和硬度视同一个同等价格的物品。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"预置幻影","schools":["幻术"],"grade":"C","power":"6","price":"C+1000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"预置幻影 \n专业：幻术 \n威力：6 \n价格：C+1000 \n动作：标准动作 \n能耗：3 \n成分：姿势，语言 \n射程：5*智力*威力米 \n范围：无 \n持续：永久，直到被驱散 \n效果：你在施法距离内创造一个幻象，其外观为一个物件，一个生物或其他可视的现象，并使其在特定情况下激活。该幻象在被激活前无法被察觉。它必须不大于威力*智力立方米，而你将在施放该法术时决定幻象该如何行动和发出什么声音。而这种按脚本执行的表演可以持续至多5分钟。 \n你所指定的情况发生时，幻象会迅速成型并按设定的方式表演。表演结束后，幻象将消失并潜伏10分钟。这段时间过后，幻象就可以再次被激活。 \n触发幻象的情况可以是一般事件，也可以按你的要求进行细化，但是它必须是发生在目标区域周围威力*智力米内的目标的能看到或听到的状况。例如，你可以制造一个自己的幻象，在其他人试图打开一扇设置了陷阱的门时出现并发出警告，或者你也可以设置一个在生物说出正确单词或短语才触发的幻象。 \n由于幻象无法被碰到，任何与该幻象进行的物理互动都会立刻暴露。 \n一个生物看到或听到幻象时，它可以进行一次DC为法术威力的感知+调查（侦查）或感知+调查（聆听）检定，以判定是否看穿幻象。辨出幻象的生物可以看穿该影像，其产生的声响对该生物而言显得虚假。"},{"name":"幻象铠甲","schools":["幻术"],"grade":"B","power":"12","price":"B+2000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"幻象铠甲 \n专业：幻术 \n威力：12 \n价格：B+2000 \n动作：标准动作 \n能耗：5点魔力 \n射程：接触 \n范围：无 \n持续：智力*1小时 \n效果：你进行一次施法判定，将法术威力作为DP加值计入判定中，创建一件幻象铠甲。 \n幻象铠甲为目标提供等同你施法判定成功数/2的防御上的力场加值，成功数/6的全伤害吸收。 \n甲胄的样式可以由你定义，其外观本质上是一个视觉幻术效果。 \n身着幻象铠甲的生物在一个场景内受到同一目标的第一次攻击时可完整应用法术效果，同一目标的第二次攻击开始可以在每次攻击 \n时进行意志判定，每有1点判定成功数无视1点本能力带来的力场加值，每有3点判定成功数无视1点本能力带来的全伤害吸收。 \n免疫幻术的生物无视本能力带来的力场加值和全伤害吸收。 \n\n版权所有 (C) 2003-2018 lv20112668。"},{"name":"投影魔术","schools":["幻术"],"grade":"B","power":"12","price":"B+2000","kind":"技艺","source":"通用魔法专章","bucket":"专章","body":"投影魔术 \n专业：幻术 \n\n创造 \n威力：12 定，判定成功数作为其豁免中的减值。 \n攻击法阵整体视为攻击了法术整体，法术整体视为一个A+4000的物体，但处于空间法则效果的保护之下，只有免疫对应等级的空间法则效果影响的目标可以对其正常发动攻击，法术整体被击溃时，法术结束。"},{"name":"蛊冥恸哭破","schools":["空间","死灵"],"grade":"A","power":"24","price":"A+4000","kind":"技艺","source":"五极天式","bucket":"视为通用","body":"蛊冥恸哭破 \n专业：空间，死灵 \n威力：24 \n价格：A+4000 \n动作：整轮 \n能耗：7 \n成份：语言，动作 \n射程：10米*智力*威力值 \n范围：5米*智力*威力值 \n持续：一个场景 \n描述：比鬣狗更饥渴的饿鬼，饕餮更贪婪的死灵。 \n速自生畜道中而来。 \n应汝之所期，将此生灵肉厕血，皆为献祭。 \n蛊冥恸哭破！ \n掌管饥饿的闇神蛊冥借力，阴森森的邪气笔直冲天而起，让来自地狱之底的极恶饿鬼，藉由咒力暂时重回地上，吞噬所接触到的一切生命。在范围内会出现极巨大的转动法阵，幻化出无边无际的幽深漩涡和无数的饿鬼，四周的土地会瞬间尽数化为毫无生命的黑色。 \n效果：法术范围内受到S级空间封锁效果，相应等级或更低的传送能力无法启动也无法进入。 \n法术范围内所有体积和耐力均为1的生物立即死亡。 \n一根邪气构成的触手从每个生物身边最近的物体上出现，你和这些生物之间不必有效果线，同时你指定的生物不会受这个效果影响。 \n目标每轮受到两倍法术威力的纠缠点数，可叠加，反射豁免，受到等同此能力带来的纠缠点数一半的腐蚀伤害和音波伤害。 \n你进行一次施法判定，每个生物在反射豁免中受到等同你判定成功数的豁免减值。 \n攻击触手或是攻击法阵整体都视为攻击了法术整体，法术整体视为一个A+4000的物体，但处于空间法则效果的保护之下，只有免疫对应等级的空间法则效果影响的生物可以对其正常发动攻击，法术整体被击溃时，法术结束。"},{"name":"逆行时舟","schools":["时间"],"grade":"S","power":"48","price":"S+8000","kind":"技艺","source":"五极天式","bucket":"视为通用","body":"逆行时舟 \n前提：五极天式中前三式 \n专业：时间 \n威力：48 \n价格：S+8000 \n动作：整轮 \n能耗：9 \n成份：语言，动作 \n射程：无 \n范围：5米*智力*威力值 \n持续：一个场景 \n描述：比前生更古老的过去，比来世更遥远的未来…… \n恒久不变的古老之梦，遵守时光的约定…… \n请将您手中的巨塔，放置在过去与未来的交会之处，让愚者在塔中失去方向… \n迷失在比宇宙诞生还久远的古代，比世界灭亡更遥远的未来，直至无尽的永恒…… \n逆行时舟 \n当咒语唱颂已近尾声，在激烈旋转的黑暗冥气漩涡中，一个隐约闪动的形影，五大黑暗神明之中的古梦，慢慢地现身了。四周出现无尽的星空，一个身穿黑色礼服的白发老人，站在如日晷般的法阵中，背后是一个巨大的齿轮。他大半身体都是一种黑色的透明状态，看不真切，只有一双金黄瞳孔，呈现奇特的沙漏状。当咒语念完，他伸出透明的黑色手掌，垂下一只精致的怀表，如同钟摆般晃动，而背后的齿轮也开始慢慢地转动着。 \n效果：你以自身为中心展开法阵，法术范围内受到S级空间封锁效果，相应等级或更低的传送能力无法启动也无法进入。 \n施法时，你可以立即进行一次，之后则是每轮以标准动作进行一次，选择一个范围内的生物，目标的寿命向前或者向后摆动50年，下一次选择这个生物时，必须反向选择摆动两倍的时长，若目标的寿命因此来到出生前或寿尽，目标就会化为飞灰，同时时间线收束将目标的存在痕迹完全抹消，这视为目标死亡且不触发任何以伤害或死亡来触发的效果，并且目标在本影片中再也无法复活，这可能能让你消灭一些原本不可能消灭的事物，此外，在反复的摆动过程中，目标会受到年龄减值（但并不高，在这一等级足以忽略不计），每次摆动，目标的耐力会受到摆动次数点伤害，因此耐力归0的生物与之前的死亡同样处理，这个法术是S级基于时间法则的效果。 \n攻击法阵整体视为攻击了法术整体，法术整体视为一个S+8000的物体，但处于空间法则效果的保护之下，只有免疫对应等级的空间法则效果影响的生物可以对其正常发动攻击，法术整体被击溃时，法术结束。"},{"name":"因果轮转","schools":["命运"],"grade":"S","power":"48","price":"S+8000","kind":"技艺","source":"五极天式","bucket":"视为通用","body":"因果轮转 \n前提：五极天式中前四式 \n专业：命运 \n威力：48 \n价格：S+8000 \n动作：整轮 \n能耗：9魔力和9点意志，每维持一轮再消耗各9点 \n成份：语言，动作 \n射程：无 \n范围：5米*智力*威力值 \n持续：整轮动作维持，至多持续一个场景 \n描述：比黑暗更深沉的颜色，比星空更悠远的牵连。 \n转动于三千时空的命运转轮，我在此请您聆听我的祈愿，遵守宇宙的至高法则…… \n请将命运的纺锤线，连结向业障与果报的审判之端，在末日天谴降临之前，重连因果律之线…… \n因果转轮！ \n自由魔环在耀眼的强光中，迸然炸成碎片，缭绕在黑色光球周遭的滚滚黑雾也一下子排开，虚空中出现了一个缥缈不实的神明形象。一个穿着灰色斗篷，看不清楚面孔的老妇人，面前是一个不停滚动的纺纱轮轴，雪白色的丝线，往外无止境地连结，随着轮轴的迅速滚动，编织成蛛网一样的东西。 \n\n老妇人一下子站了起来，尽管面孔仍模糊不清，但仅有的一只眼睛，却绽放出强光，跟着她平举双手，两只手掌的掌心，各有一只眼睛，当这三只代表过去、现在、未来的眼睛一起盛放强光，小乔的身影便消失在强光之中。而在另—个没有人看得到的命运空间，眼前蛛网般错综复杂的亿万条丝线，知道自己只有非常简短的几秒时间。 \n\n这么多的丝线，每一条都代表着某个人、某件事物。有些丝线粗长如索，有些却短细欲断，这些粗细柔韧的不同，则是因为事物的因缘业力，如果某些人或事的业障倾强，又或者受到强大能量的屏障守护，这些人就不容易发生改变。 \n效果：法术施展后，你会进入一个特殊的命运空间，对你而言你视为依然站在原地，能正常看到其他生物，但每个生物上都有诸多因果之线，其中有粗有细，而对他人来说，你在原地消失了，不再存在于这个世界，你原本所在的位置即为你留下的空间道标。法术结束后，你会在该位置上出现。若道标被摧毁，法术立即结束，你将被留在命运空间之中，除非你有其他能脱离的能力。 \n斩断命运之线：施展法术以及维持法术的每轮你可以对目标最粗壮的命运之线造成等同法术威力的伤害，这通常可以目标失去了同等程度的生命上限，目标生命上限归0，就会死去，同时在影片中视同没有存在过，其原本做下的事迹都会转嫁到他人身上，对轮回者而言影响不算剧情，但对剧情NPC来说会产生天翻地覆的变化，若你以此能力杀死剧情NPC，必然会得到剧情改变奖励，同时影片的难度会相应变化。 \n斩断其他因果：也可以不对其最粗壮的命运之线造成伤害，而是对其他的造成伤害，你自动知道每一根线的生命值和它所代表的含义，斩断因果线将让一件事变得视为没有发生过，不仅因果关联的双方都不失去对此的记忆，同时这件事事实上也视为没有发生，例如你切断了目标生物身上一个诅咒的因果，那么这个诅咒就不曾被施展过，这些因果线的生命值等同对应因果的支线等级所决定的生命值D-S分别为10/25/65/175/485，例如你试图从目标身上移除一个D级诅咒，删除目标一项C级强化，或者获得一个B级改变剧情奖励等等 \n如果一个因果有前后关系，你必须先剥离最后获得的因果，例如你试图删除一个生物的D级血统，你得先删除他的SABC级才行。 \n\n五极天式连发"},{"name":"龙之力","schools":[],"grade":"B","power":"12","price":"B+2000","kind":"能力组","source":"灭龙魔导士","bucket":"视为通用","body":"龙之力 \n专业：无 \n威力：12 \n价格：B+2000 \n动作：自由 \n能耗：5点魔力 \n成分：语言，姿势 \n射程：自身 \n范围：无 \n持续：一个场景 \n该法术让灭龙魔导士从体内引出更多的龙魔力并强化其使用的法术。 \n每场景只能使用一次本法术，施法者获得法术威力值的临时魔力，临时魔力优先使用并且可以和自身魔力混用以进行支付，未被消耗的临时魔力会在法术结束时自动消散 \n此法，施法者施展的法术威力提升本法术威力/4点。 \n本法术威力不受任何临时性威力调整所改变。包括有持续时间的提升效果，以及来自物品的提升效果。 \n本法术持续中，会产生明显可见的效果，火焰，雷电，阴影，光芒等效果缠绕在你身边，或是狂风在你身边呼啸，紫色的毒气环绕着你，或者身躯变为钢铁状等。 \n在你触及范围内开始回合的生物会受到等同本法术威力的某种严重伤害。 \n火/雷/影/光对应的伤害类型为火焰，电击，腐蚀，纯能。 \n天龙对应的伤害类型是力场，毒龙对应的是毒素。 \n特殊的，铁龙不会造成伤害，而是使自身的硬度提升法术威力/3点，天生防御提升法术威力/2点。 \n特殊：若你因A级灭龙魔导士特性处于混合龙效果之下，本法术可以同时使用等同混合龙数次，所有效果叠加计算。注意，即使你购买了不同种类的灭龙魔导士也不意味着你会处于混合龙的效果之下，依然必须经有A级特性吞食原本无法吞食的对象才行。 \n特殊：本法术状态下施展的法术若持续时间高于本法术持续时间，会在本法术结束时一并结束。 \n特殊：本法术升阶至A级时就可以叫做X龙王模式 \n\n火龙专属灭龙魔法 \n火龙的煌炎 \n本法术等同比照爆炸火球"}]}</script>
  <script>
    const DATA = JSON.parse(document.getElementById("data").textContent);
    const SPELLS = DATA.spells;
    const STATS = DATA.stats;
    const SCHOOLS = ["全部","塑能","变化","精神","创造","召唤","附魔","结界","幻术","预言","诅咒","咒法","死灵","防护","空间","时间","命运","未标专业"];
    const GRADES = ["全部","无支线","D","C","B","A","S"];
    const KINDS = ["全部","专章","血统","能力组","技艺","捆绑包"];
    const state = { school: "全部", grade: "全部", kind: "全部", q: "" };
    const openKeys = new Set();

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }
    function schoolOf(s) { return s.schools.length ? s.schools : ["未标专业"]; }
    function kindCount(k) {
      if (k === "全部") return STATS.total;
      if (k === "专章") return STATS.byBucket["专章"] || 0;
      return SPELLS.filter(s => s.bucket !== "专章" && s.kind === k).length;
    }
    function chips(id, items, key, labelFn) {
      const box = document.getElementById(id);
      box.innerHTML = "";
      items.forEach(item => {
        const b = document.createElement("button");
        b.className = "chip" + (state[key] === item ? " on" : "");
        b.textContent = labelFn(item);
        b.onclick = () => { state[key] = item; render(); };
        box.appendChild(b);
      });
    }
    function filtered() {
      const q = state.q.trim().toLowerCase();
      return SPELLS.map((s, i) => ({ s, i })).filter(({ s }) => {
        if (state.school !== "全部" && !schoolOf(s).includes(state.school)) return false;
        if (state.grade !== "全部" && s.grade !== state.grade) return false;
        if (state.kind !== "全部") {
          if (state.kind === "专章") { if (s.bucket !== "专章") return false; }
          else if (s.kind !== state.kind || s.bucket === "专章") return false;
        }
        if (q) {
          const hay = (s.name + " " + s.schools.join(" ") + " " + s.source + " " + (s.body || "")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }
    function render() {
      document.getElementById("stats").innerHTML = [
        ["独立条目", STATS.total],
        ["专章法术", STATS.byBucket["专章"]],
        ["其它资源视为通用", STATS.byBucket["视为通用"]],
        ["双专业及以上", STATS.dual]
      ].map(([l,v]) => '<div class="stat"><b>' + v + "</b><span>" + l + "</span></div>").join("");
      chips("schools", SCHOOLS, "school", s => s);
      chips("grades", GRADES, "grade", g => g === "全部" ? g : g + " " + (STATS.byGrade[g] || 0));
      chips("kinds", KINDS, "kind", k => k === "全部" ? k : k + " " + kindCount(k));
      const rows = filtered();
      document.getElementById("table-title").textContent = "共 " + rows.length + " 条";
      const list = document.getElementById("list");
      if (!rows.length) {
        list.innerHTML = '<div class="empty">没有符合筛选的法术</div>';
        return;
      }
      list.innerHTML = rows.map(({ s, i }) => {
        const key = String(i);
        const open = openKeys.has(key) ? " open" : "";
        const meta = [
          (s.schools.join("、") || "未标专业"),
          s.grade,
          s.power ? ("威力 " + s.power) : "",
          s.price || "",
          s.source
        ].filter(Boolean).join(" · ");
        return '<details class="spell"' + open + ' data-key="' + key + '">' +
          "<summary><span class=\"name\">" + esc(s.name) + "</span>" +
          "<span class=\"meta\">" + esc(meta) + "</span></summary>" +
          "<div class=\"body\">" + esc(s.body || "") + "</div></details>";
      }).join("");
    }
    document.getElementById("list").addEventListener("toggle", e => {
      const el = e.target;
      if (!el.classList || !el.classList.contains("spell")) return;
      const key = el.getAttribute("data-key");
      if (el.open) openKeys.add(key); else openKeys.delete(key);
    }, true);
    document.getElementById("open-all").onclick = () => {
      document.querySelectorAll("#list .spell").forEach(el => {
        el.open = true;
        openKeys.add(el.getAttribute("data-key"));
      });
    };
    document.getElementById("close-all").onclick = () => {
      document.querySelectorAll("#list .spell").forEach(el => { el.open = false; });
      openKeys.clear();
    };
    document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
    render();
  </script>
</body>
</html>
